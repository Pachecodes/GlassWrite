<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">GlassWrite interaction flow</title><desc id="desc">Focused eligible text goes through field checks to local Ollama. Review the untrusted suggestion, then explicitly choose Copy, guarded Replace or Ignore. Manual mode is the default.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#85a5c9"/></marker></defs><rect width="1200" height="600" rx="24" fill="#0b1727"/><text x="40" y="55" font-family="sans-serif" font-size="17" font-weight="600" fill="#73e0d4">GLASSWRITE / INTERACTION DIAGRAM</text><text x="40" y="105" font-family="sans-serif" font-size="34" font-weight="600" fill="#e9eef7">Your text. A local suggestion. Your decision.</text><text x="40" y="140" font-family="sans-serif" font-size="20" font-weight="400" fill="#c5d2e6">Manual analysis by default · Live is optional and off at launch</text><path d="M285 245 L320 245" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M575 245 L610 245" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M865 245 L900 245" stroke="#85a5c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="190" width="250" height="110" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="60" y="227" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">01 / Focused field</text><text x="60" y="259" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Non-sensitive sample text</text><rect x="330" y="190" width="250" height="110" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="350" y="227" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">02 / Field checks</text><text x="350" y="259" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Eligible Accessibility text</text><rect x="620" y="190" width="250" height="110" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="640" y="227" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">03 / Local Ollama</text><text x="640" y="259" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Up to 500 snippet chars</text><rect x="910" y="190" width="250" height="110" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="930" y="227" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">04 / Review</text><text x="930" y="259" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Suggestion is untrusted</text><path d="M1035 300 V355 H220 M600 355 V375 M980 355 V375" stroke="#85a5c9" stroke-width="3" fill="none"/><path d="M220 355 L220 375" stroke="#85a5c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 355 L600 375" stroke="#85a5c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 355 L980 375" stroke="#85a5c9" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="340" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">You choose what happens next</text><rect x="40" y="375" width="360" height="100" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="60" y="412" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Copy</text><text x="60" y="444" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Explicit clipboard write</text><rect x="420" y="375" width="360" height="100" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="440" y="412" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Replace</text><text x="440" y="444" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Recheck focus + exact text</text><rect x="800" y="375" width="360" height="100" rx="14" fill="#152236" stroke="#73e0d4" stroke-width="2"/><text x="820" y="412" font-family="sans-serif" font-size="22" font-weight="600" fill="#e9eef7">Ignore</text><text x="820" y="444" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Clear captured text + suggestion</text><text x="40" y="525" font-family="sans-serif" font-size="21" font-weight="400" fill="#ffd097">Privacy boundary: filtering depends on other apps’ metadata. Never use secrets.</text><text x="40" y="562" font-family="sans-serif" font-size="17" font-weight="400" fill="#c5d2e6">Diagram only · Not a screenshot · No promise of correction quality or atomic replacement</text></svg>

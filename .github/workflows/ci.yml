name: Native macOS gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Native tests
        run: xcodebuild -project GlassWrite.xcodeproj -scheme GlassWrite -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/GlassWriteTests" test CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: xcodebuild -project GlassWrite.xcodeproj -scheme GlassWrite -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/GlassWriteRelease" build CODE_SIGNING_ALLOWED=NO
